<div class="toolbar">
    <h2><i class="bi bi-people-fill"></i> User Management</h2>
    <button class="btn btn-primary" id="btnAddUser">
        <i class="bi bi-person-plus=fill"></i> Add User
    </button>
</div>

<div class="card">
    <div class="card-header">All Users</div>
    <div class="card-body" style="padding: 0; overflow-x: auto;">
        <table class="data-table">
            <thead>
                <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Role</th>
                <th>Branch</th>
                <th>Created</th>
                <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="6" class="text-center" style="padding: 20px;">Loading users...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<template id="tpl-user-row">
    <tr>
        <td><strong class="data-name"></strong></td>
        <td class="data-username"></td>
        <td><span class="badge data-role"></span></td>
        <td><span class="badge badge-neutral data-branch"></span></td>
        <td class="data-created"></td>
        <td class="text-right"> 
            <div style="display: flex; gap: 6px; justify-content: flex-end;">
            <button class="btn btn-sm btn-outline btn-edit"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-danger btn-delete"><i class = "bi bi-trash"></i></button>
            </div>
        </td>
    </tr>
</template>

<template id="tpl-user-modal">
    <div class="modal-overlay" id="userModalOverlay">
        <div class="modal-card" style="background: var(--bg-surface); width:90%; max-width: 480px; border-radius: 12px; box-shadow: var(--shadow-lg);">
            <div class="modal-header">
                <h3 class="modal-title" style="margin:0;"></h3>
                <button class="close-btn" id="btnCloseModal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="userId" />
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="userName" class="form-control" placeholder="Full name">
                </div>

                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" id="userUsername" class="form-control" placeholder="Username">
                </div>
                <div class="form-group">
                    <label class="form-label" id="passwordLabel">Password *</label>
                    <input type="password" id="userPassword" class="form-control" placeholder="Password">
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex:1;">
                        <label class="form-label">Role</label>
                        <select id="userRole" class="form-control">
                            <option value="staff">Staff (Branch Isolated)</option>
                            <option value="admin">Administrator (Full Access)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Assigned Branch *</label>
                        <select id="userBranch" class="form-control">
                            <option value="1">Branch 1</option>
                            <option value="2">Branch 2</option>
                            <option value="">None / Head Office</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="btnCancelModal">Cancel</button>
                <button class="btn btn-primary" id="btnSaveUser">Save User</button>
            </div>
        </div>
    </div>
</template>
