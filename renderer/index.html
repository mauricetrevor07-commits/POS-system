<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autopak POS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="manifest" href="manifest.json">
  <!-- SheetJS for Excel import/export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2pdf for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="login-container" style="display:flex; justify-content:center; align-items:center; min-height:100vh;"></div>
<button class="hamburger no-print" onclick="toggleSidebar()">
  <i class="bi bi-list"></i>
</button>
  <div id="app-container" class="app-container" style="display:none;">
    <aside class="sidebar no-print">
      <div class="sidebar-header">
        <h2>POS <span id="branchBadge" style="font-size:0.8em; background:#eee; padding:2px 6px;"></span></h2>
      </div>
      <ul class="nav" id="mainNav">
        <!-- dynamically filled by app.js based on role -->
      </ul>
    </aside>
    <main class="main-content" id="page-content"></main>
  </div>
  <div id="modal-root"></div>

  <script src="js/cache.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/modules/login.js"></script>
  <script src="js/modules/products.js"></script>
  <script src="js/modules/customers.js"></script>
  <script src="js/modules/pos.js"></script>
  <script src="js/modules/sales.js"></script>
  <script src="js/modules/transfers.js"></script>
  <script src="js/modules/admin-payments.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/users.js"></script>
  <script src="js/modules/sync.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
