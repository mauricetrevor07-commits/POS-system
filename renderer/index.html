<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTOPAK MANUFACTURERS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <div id="login-container" style="display: none !important;"></div>

    <button class="hamburger no-print" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

  
    <div id="app-container" class="app-container" style="display: flex !important;">
      <aside class="sidebar no print">
        <div class="sidebar-header">
          <h2>Point of Sale Terminal <span id="branchBadge" class="badge badge-neutral"></span></h2>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav" id="mainNav">
          </ul>
        </nav>
      </aside>

      
      <main class="main-content" id="page-content"></main>
    </div>

    
    <div id="modal-root"></div>

    <template id="login-template">
      <div class="login-split-layout">
        <div class="login-brand-panel" style-="background-image: url('assets/login-bg.jpg');">
          <div class="brand-overlay"></div>
          <div class="brand-content">
            <div class="brand-logo">
              <img src="assets/logo.png" alt="AUTOPAK Int. logo" class="company-logo-img">
            </div>
            <h1>Point of Sale & Inventory Management.</h1>
          </div>
        </div>
      </div>
      <div class="login-form-panel">
        <div class="login-form-container">

          <div class="login-header">
            <h2>Welcome back</h2>
            <p>Enter your credentials to access your dashboard</p>
          </div>

          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="loginUsername">Username</label>
              <input id="loginUsername" type="text" class="form-control" placeholder="Username" required autocomplete="username">
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <input id="loginPassword" type="password" class="form-control" placeholder="********" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="margin-top: 8px;">
              Sign In
            </button>

            <div style="text-align: center; margin-top: 20px;">
              <a href="#" style="font-size: 0.9rem; color: var(--primary); text-decoration: none; font-weight: 500; transition: color 0.2s;">Forgot password?</a>
            </div>
            
            <p id="loginError" class="login-error"></p>
          </form>

          <div class="login-footer">
            2026 Autopak Systems. All rights reserved.
          </div>
        </div>
      </div>
    </template>

    <script src="js/cache.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/database.js"></script>
    <script src="js/modules/login.js"></script>
    <script src="js/modules/products.js"></script>
    <script src="js/modules/customers.js"></script>
    <script src="js/modules/pos.js"></script>
    <script src="js/modules/sales.js"></script>
    <script src="js/modules/transfers.js"></script>
    <script src="js/modules/admin-payments.js"></script>
    <script src="js/modules/reports.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/modules/users.js"></script>
    <script src="js/modules/sync.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
