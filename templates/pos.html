<div class="pos-layout no-print">
  
  <!-- LEFT SIDE: Products -->
  <section class="pos-products">
    
    <!-- Toolbar -->
    <div class="toolbar">
      <h2>New Sale Terminal</h2>
    </div>

    <!-- Category Filter Buttons -->
    <div class="pos-category-bar" id="posCategoryBar" style="display:flex; gap:8px; margin-bottom:20px; overflow-x:auto; padding-bottom:4px;">
      <button class="btn btn-sm btn-primary" data-category="all"><i class="bi bi-grid-fill"></i> All Products</button>
      <button class="btn btn-sm btn-outline" data-category="pipe"><i class="bi bi-water"></i> HDPE Pipes</button>
      <button class="btn btn-sm btn-outline" data-category="sack"><i class="bi bi-box-seam"></i> Heavy Duty Sacks</button>
      <button class="btn btn-sm btn-outline" data-category="fittings"><i class="bi bi-wrench"></i> Fittings & Accessories</button>
    </div>

    <!-- Search Bar -->
    <div class="form-group" style="margin-bottom: 24px;">
      <input type="text" id="searchProducts" class="form-control" placeholder="Search product by name, barcode, or category..." />
    </div>

    <!-- Product Grid Container -->
    <div id="productGrid" style="flex: 1; overflow-y: auto;">
      <div style="padding: 40px; text-align: center; color: var(--text-muted);">
        Loading products...
      </div>
    </div>
    
  </section>

  <!-- RIGHT SIDE: Cart & Checkout -->
  <aside class="pos-cart">
    
    <!-- Customer Selection -->
    <div class="cart-header" style="display: flex; flex-direction: column; gap: 8px; align-items: stretch;">
      <label class="form-label" for="customerSelect">Select Customer</label>
      <select id="customerSelect" class="form-control">
        <option value="">Walk-in Customer [RETAIL]</option>
      </select>
      <div id="customerTierBadge" style="min-height: 24px;"></div>
    </div>

    <!-- Cart Items (Scrollable) -->
    <div class="cart-items" id="cartItems">
      <p style="text-align:center; color: var(--text-muted); margin-top: 20px;">
        Cart is empty. Select items to add.
      </p>
    </div>

    <!-- Checkout Footer -->
    <div class="cart-footer">
      
      <!-- VAT Selection -->
      <div class="form-group" style="margin-bottom: 16px;">
        <select id="vatSelect" class="form-control">
          <option value="0.16">Value Added Tax Included (16%)</option>
          <option value="0">Without VAT (0% / Exempt)</option>
        </select>
      </div>

      <!-- Grand Total -->
      <div class="cart-total" style="margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
        <span>Total</span>
        <span class="price-large" id="cartTotal">KES 0.00</span>
      </div>

      <!-- Payment Method -->
      <div class="form-group" style="margin-bottom: 12px;">
        <label class="form-label" for="paymentMethod">Payment Method</label>
        <select id="paymentMethod" class="form-control">
          <option value="mobile_money">M-Pesa / Mobile Money</option>
          <option value="bank_transfer">Bank Transfer / EFT</option>
          <option value="cheque">Cheque Deposit</option>
          <option value="credit">Credit / Pay on Account (Terms)</option>
          <option value="cash">Cash Payment</option>
        </select>
      </div>

      <!-- Credit Terms (Hidden by Default) -->
      <div id="creditTermsSection" class="hidden" style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px; margin-bottom: 12px;">
        <div class="form-group" style="margin-bottom: 8px;">
          <label class="form-label" for="creditTermsSelect">Credit Period</label>
          <select id="creditTermsSelect" class="form-control">
            <option value="30 Days Net">30 Days Net</option>
            <option value="7 Days Net">7 Days Net</option>
            <option value="14 Days Net">14 Days Net</option>
            <option value="60 Days Net">60 Days Net</option>
            <option value="Custom">Custom Date</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label class="form-label" for="creditDueDate">Due Date</label>
          <input type="date" id="creditDueDate" class="form-control" />
        </div>
      </div>

      <!-- Payment Reference -->
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label" for="paymentRef">Payment Ref / LPO #</label>
        <input type="text" id="paymentRef" class="form-control" placeholder="Enter Transaction Ref #" />
      </div>

      <!-- Action Buttons -->
      <button id="btnCheckout" class="btn btn-primary btn-block" style="padding: 14px; font-size: 1rem;">
        <i class="bi bi-send-check"></i> Submit Sale
      </button>
      
      <button id="btnClearCart" class="btn btn-secondary btn-block" style="margin-top: 8px;">
        <i class="bi bi-trash"></i> Clear Order
      </button>
      
    </div>
  </aside>

</div>
